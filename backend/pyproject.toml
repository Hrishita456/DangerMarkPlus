[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "danger-mark-backend"
version = "0.1.0"
description = "DANGER MARK+ deterministic demo replay API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
geospatial = ["geopandas==1.1.1", "shapely==2.1.2", "rasterio==1.4.3", "osmnx==2.0.7", "networkx==3.5", "pyproj==3.7.2", "numpy==2.3.3", "pandas==2.3.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
