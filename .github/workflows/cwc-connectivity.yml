name: CWC connectivity check

on:
  push:
    paths:
      - ".github/workflows/cwc-connectivity.yml"
  workflow_dispatch:

jobs:
  verify-cwc:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch verified CWC station observations
        run: |
          python - <<'PY'
          import json
          from math import isfinite
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          base = "https://ffs.india-water.gov.in"
          stations = {
              "015-UYDDEL": "Delhi Railway Bridge",
              "022-UYDDEL": "Dhansa",
              "017-UYDDEL": "Mathura (Prayag ghat)",
          }

          def fetch(path, specification):
              query = urlencode({"specification": json.dumps(specification, separators=(",", ":"))})
              request = Request(f"{base}{path}?{query}", headers={"Accept": "application/json"})
              with urlopen(request, timeout=20) as response:
                  print(f"GET {path}: HTTP {response.status}")
                  payload = json.load(response)
              if not isinstance(payload, list):
                  raise ValueError(f"Unexpected response from {path}")
              return payload

          metadata = fetch("/iam/api/flood-forecast-static/specification/", {
              "where": {"expression": {
                  "valueIsRelationField": False, "fieldName": "type",
                  "operator": "eq", "value": "Level",
              }},
          })
          for station_id, name in stations.items():
              rows = fetch("/iam/api/new-entry-data-aggregate/specification/", {
                  "where": {
                      "expression": {
                          "valueIsRelationField": False, "fieldName": "id.stationCode",
                          "operator": "eq", "value": station_id,
                      },
                      "and": {"expression": {
                          "valueIsRelationField": False, "fieldName": "id.datatypeCode",
                          "operator": "eq", "value": "HHS",
                      }},
                  },
              })
              observation = next((row for row in rows if row.get("id", {}).get("stationCode") == station_id), None)
              station = next((row for row in metadata if row.get("layerStationStationCode") == station_id), None)
              value = observation.get("latestDataValue") if observation else None
              observed_at = observation.get("latestDataTime") if observation else None
              warning = station.get("warningLevel") if station else None
              danger = station.get("dangerLevel") if station else None
              if (not isinstance(value, (int, float)) or isinstance(value, bool) or not isfinite(value)
                      or not isinstance(observed_at, str) or not observed_at
                      or not isinstance(warning, (int, float)) or not isfinite(warning)
                      or not isinstance(danger, (int, float)) or not isfinite(danger)):
                  raise ValueError(f"Incomplete official CWC data for {station_id} ({name})")
              print(f"PASS {station_id} {name}: {value} m at {observed_at}; warning={warning}, danger={danger}")
          PY
